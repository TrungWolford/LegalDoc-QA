# Legal vocabulary: section keywords, party suffixes, and allowed capitalized words.
# Used to reduce false positives in term detection (these are not defined terms).

section_keywords:
  - Article
  - Section
  - Schedule
  - Exhibit
  - Appendix
  - Annex
  - Recital
  - Preamble
  - Whereas
  - Amendment
  - Addendum

party_suffixes:
  - "L.P."
  - "LP"
  - "LLC"
  - "Ltd"
  - "Ltd."
  - "Inc"
  - "Inc."
  - "Corp"
  - "Corp."
  - "Co."
  - "LLP"
  - "N.A."
  - "PLC"
  - "S.A."
  - "GmbH"
  - "AG"

