# Pattern catalog for contract parsing.
# Each pattern has an id, description, regex, flags, and a test fixture.
# Patterns are loaded once at startup and precompiled. No regex compilation in loops.

patterns:

  # --- Heading patterns ---
  article_heading:
    id: article_heading
    description: "Matches ARTICLE N headings (e.g., 'ARTICLE 1', 'ARTICLE IV', 'ARTICLE 1 - DEFINITIONS')"
    regex: "^\\s*ARTICLE\\s+([IVXLCDM]+|\\d+)\\s*(?:[–—:-]\\s*(.+))?\\s*$"
    flags: CASE_INSENSITIVE
    test:
      input: "ARTICLE 1 - DEFINITIONS"
      expectedGroups: ["1", "DEFINITIONS"]

  section_heading:
    id: section_heading
    description: "Matches section headings like '1.1', '2.3', '10.12'"
    regex: "^\\s*(\\d{1,3}\\.\\d{1,3})\\s+(.+)$"
    flags: ""
    test:
      input: "2.1 The Management Fee is 2% per annum."
      expectedGroups: ["2.1", "The Management Fee is 2% per annum."]

  subclause_heading:
    id: subclause_heading
    description: "Matches sub-clause labels like '(a)', '(b)(ii)', '(iv)'"
    regex: "^\\s*\\(([a-z]|[ivxlcdm]+)\\)\\s*(.*)$"
    flags: CASE_INSENSITIVE
    test:
      input: "(a) The General Partner shall..."
      expectedGroups: ["a", "The General Partner shall..."]

  # --- Cross-reference patterns ---
  section_reference_single:
    id: section_reference_single
    description: "Matches 'Section 7.4', 'Section 2.1(b)(ii)'"
    regex: "Section\\s+(\\d{1,3}(?:\\.\\d{1,3})*)(?:\\(([a-z])\\)(?:\\(([ivxlcdm]+)\\))?)?"
    flags: CASE_INSENSITIVE
    test:
      input: "subject to Section 7.4"
      expectedGroups: ["7.4"]

  sections_reference_and:
    id: sections_reference_and
    description: "Matches 'Sections 2.1 and 2.3'"
    regex: "Sections\\s+(\\d{1,3}(?:\\.\\d{1,3})*)\\s+and\\s+(\\d{1,3}(?:\\.\\d{1,3})*)"
    flags: CASE_INSENSITIVE
    test:
      input: "Sections 2.1 and 2.3"
      expectedGroups: ["2.1", "2.3"]

  sections_reference_through:
    id: sections_reference_through
    description: "Matches 'Section 2.1 through 2.4'"
    regex: "Sections?\\s+(\\d{1,3}(?:\\.\\d{1,3})*)\\s+through\\s+(\\d{1,3}(?:\\.\\d{1,3})*)"
    flags: CASE_INSENSITIVE
    test:
      input: "Section 2.1 through 2.4"
      expectedGroups: ["2.1", "2.4"]

  article_reference:
    id: article_reference
    description: "Matches 'Article IV', 'Article 3'"
    regex: "Article\\s+([IVXLCDM]+|\\d+)"
    flags: CASE_INSENSITIVE
    test:
      input: "as described in Article IV"
      expectedGroups: ["IV"]

  schedule_reference:
    id: schedule_reference
    description: "Matches 'Schedule A', 'Schedule 1'"
    regex: "Schedule\\s+([A-Z]|\\d+)"
    flags: CASE_INSENSITIVE
    test:
      input: "set forth in Schedule A"
      expectedGroups: ["A"]

  exhibit_reference:
    id: exhibit_reference
    description: "Matches 'Exhibit B', 'Exhibit 2'"
    regex: "Exhibit\\s+([A-Z]|\\d+)"
    flags: CASE_INSENSITIVE
    test:
      input: "attached hereto as Exhibit B"
      expectedGroups: ["B"]

  # --- Defined term patterns ---
  defined_term_quoted:
    id: defined_term_quoted
    description: "Matches quoted defined terms like '\"Fund\"', '\"Capital Commitment\"'"
    regex: "[\""]([A-Z][A-Za-z\\s]+(?:\\s[A-Z][A-Za-z]+)*)[\""]\\s+(?:means|shall mean|has the meaning)"
    flags: ""
    test:
      input: "\"Capital Commitment\" means the amount"
      expectedGroups: ["Capital Commitment"]

  capitalized_term_usage:
    id: capitalized_term_usage
    description: "Matches capitalized multi-word terms (candidate defined terms)"
    regex: "(?<![.\"])\\b([A-Z][a-z]+(?:\\s[A-Z][a-z]+)+)\\b"
    flags: ""
    test:
      input: "payable by each Limited Partner"
      expectedGroups: ["Limited Partner"]

  # --- Value patterns ---
  money_amount:
    id: money_amount
    description: "Matches dollar amounts like '$1,000,000', '$100'"
    regex: "\\$(\\d{1,3}(?:,\\d{3})*(?:\\.\\d{1,2})?)"
    flags: ""
    test:
      input: "minimum of $1,000,000"
      expectedGroups: ["1,000,000"]

  percentage:
    id: percentage
    description: "Matches percentages like '2%', '2.5%', '20.00%'"
    regex: "(\\d{1,3}(?:\\.\\d{1,4})?)\\s*%"
    flags: ""
    test:
      input: "is 2.5% per annum"
      expectedGroups: ["2.5"]

  date_mdy_long:
    id: date_mdy_long
    description: "Matches dates like 'January 15, 2025', 'December 31, 2024'"
    regex: "(January|February|March|April|May|June|July|August|September|October|November|December)\\s+(\\d{1,2}),?\\s+(\\d{4})"
    flags: ""
    test:
      input: "on January 15, 2025"
      expectedGroups: ["January", "15", "2025"]

  date_numeric:
    id: date_numeric
    description: "Matches numeric dates like '01/15/2025', '12-31-2024'"
    regex: "(\\d{1,2})[/\\-](\\d{1,2})[/\\-](\\d{4})"
    flags: ""
    test:
      input: "dated 01/15/2025"
      expectedGroups: ["01", "15", "2025"]

  number_words_with_digits:
    id: number_words_with_digits
    description: "Matches 'One Hundred Thousand Dollars ($100,000)' patterns"
    regex: "([A-Z][a-z]+(?:\\s(?:[A-Z][a-z]+|and))+)\\s+(?:Dollars|dollars|USD)\\s*\\(\\s*\\$(\\d{1,3}(?:,\\d{3})*(?:\\.\\d{1,2})?)\\s*\\)"
    flags: ""
    test:
      input: "One Hundred Thousand Dollars ($100,000)"
      expectedGroups: ["One Hundred Thousand", "100,000"]

  # --- Placeholder patterns ---
  placeholder_bracket:
    id: placeholder_bracket
    description: "Matches placeholder brackets [●], [Insert], [TBD]"
    regex: "\\[(?:●|Insert|TBD|insert|tbd|_+)\\]"
    flags: CASE_INSENSITIVE
    test:
      input: "shall be [●] days"
      expectedGroups: []

  placeholder_underscores:
    id: placeholder_underscores
    description: "Matches underscored placeholders like '____'"
    regex: "_{3,}"
    flags: ""
    test:
      input: "Name: ________"
      expectedGroups: []

  placeholder_xx:
    id: placeholder_xx
    description: "Matches 'XX' or 'xx' standalone as placeholder"
    regex: "\\b[Xx]{2,}\\b"
    flags: ""
    test:
      input: "on XX date"
      expectedGroups: []

  placeholder_tbd:
    id: placeholder_tbd
    description: "Matches standalone TBD"
    regex: "\\bTBD\\b"
    flags: ""
    test:
      input: "The rate is TBD"
      expectedGroups: []
