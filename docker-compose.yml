services:
  postgres:
    image: postgres:17
    container_name: cc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-contractdb}
      POSTGRES_USER: ${DB_USER:-contractuser}
      POSTGRES_PASSWORD: ${DB_PASS:-contractpass}
    ports:
      - "${DB_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-contractuser} -d ${DB_NAME:-contractdb}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis
    container_name: cc-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-contractdb}
      DB_USER: ${DB_USER:-contractuser}
      DB_PASS: ${DB_PASS:-contractpass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_min_64_chars_long_abcdefghijklmnop}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SPRING_PROFILES_ACTIVE: docker
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
